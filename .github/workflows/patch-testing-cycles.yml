# Forged copy of the "Patch Testing Cycles" workflow kept under the same name so the
# privileged `workflow_run` consumer (Patch Testing Cycles Comment) fires on it.
name: Patch Testing Cycles

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  patch-testing-cycles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v6"

      - name: "Upload cycle stats"
        uses: actions/upload-artifact@v4
        with:
          name: patch-testing-results
          path: |
            payload/Cargo.toml
            payload/src/main.rs
          retention-days: 1
