# Environmental-only variant used to exercise the `Patch Testing Cycles Comment`
# workflow end to end on a stock GitHub-hosted runner. The upstream job targets a
# self-hosted RunsOn runner labelled `runner=16cpu-linux-x64` and performs hours of
# SP1 proving; neither is available in this isolated copy. The workflow name and the
# trigger (pull_request, same event/`pull_requests` linkage) are unchanged, and the
# produced artifact keeps the exact name/paths the consumer workflow downloads.
name: Patch Testing Cycles

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  patch-testing-cycles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout sources"
        uses: "actions/checkout@v6"
        with:
          fetch-depth: 0

      - name: "Produce cycle stats"
        run: |
          cat > patch-testing/old_cycle_stats.json <<'JSON'
          [{"name": "baseline-old", "cycles": 1000}]
          JSON
          cat > patch-testing/new_cycle_stats.json <<'JSON'
          [{"name": "baseline-new", "cycles": 900}]
          JSON

      - name: "Upload cycle stats"
        uses: actions/upload-artifact@v4
        with:
          name: patch-testing-results
          path: |
            patch-testing/new_cycle_stats.json
            patch-testing/old_cycle_stats.json
          retention-days: 1
